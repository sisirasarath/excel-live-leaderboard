<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Samskara FIFA Prediction Leaderboard</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Stylesheet -->
  <link rel="stylesheet" href="styles.css">
  <!-- Libraries (PapaParse for Google Sheets CSV, Canvas Confetti for celebrate) -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.umd.min.js"></script>
</head>
<body>
  <div class="stars-overlay"></div>
  <div class="glow-bg-1"></div>
  <div class="glow-bg-2"></div>

  <div class="app-container">
    <!-- Header -->
    <header class="glass-panel main-header">
      <div class="header-logo">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
          </svg>
        </div>
        <h1>SAMSKARA<span> FIFA PREDICTIONS</span></h1>
      </div>
      
      <div class="header-status">
        <div id="statusIndicator" class="status-badge status-offline">
          <span class="status-dot"></span>
          <span id="statusText">Connecting...</span>
        </div>
        <div class="last-updated">
          <span>Updated:</span>
          <span id="lastUpdatedTime">Never</span>
        </div>
      </div>
    </header>

    <!-- Metrics Cards -->
    <section class="metrics-grid">
      <!-- Top Performer -->
      <div class="glass-panel metric-card gold-glow">
        <div class="metric-icon gold-theme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="8" r="7"/>
            <path d="M8.21 13.89L7 23l5-3 5 3-1.21-9.12"/>
          </svg>
        </div>
        <div class="metric-info">
          <h3>Current Leader</h3>
          <p id="metricTopPlayer" class="metric-val">Loading...</p>
          <span id="metricTopScore" class="metric-sub">Score: 0</span>
        </div>
      </div>

      <!-- Total Players -->
      <div class="glass-panel metric-card cyan-glow">
        <div class="metric-icon cyan-theme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
        </div>
        <div class="metric-info">
          <h3>Total Players</h3>
          <p id="metricTotalPlayers" class="metric-val">0</p>
          <span class="metric-sub">Active members</span>
        </div>
      </div>

      <!-- Top Team -->
      <div class="glass-panel metric-card purple-glow">
        <div class="metric-icon purple-theme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
        </div>
        <div class="metric-info">
          <h3>Dominant Team</h3>
          <p id="metricTopTeam" class="metric-val">Loading...</p>
          <span id="metricTeamAvg" class="metric-sub">Highest avg score</span>
        </div>
      </div>

      <!-- Average Score -->
      <div class="glass-panel metric-card green-glow">
        <div class="metric-icon green-theme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M23 6l-9.5 9.5-5-5L1 18"/>
            <path d="M17 6h6v6"/>
          </svg>
        </div>
        <div class="metric-info">
          <h3>Average Score</h3>
          <p id="metricAvgScore" class="metric-val">0</p>
          <span class="metric-sub">Across all players</span>
        </div>
      </div>
    </section>

    <!-- Interactive Dashboard Controls -->
    <div class="glass-panel controls-bar">
      <div class="search-box">
        <div class="search-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </div>
        <input type="text" id="searchInput" placeholder="Search by name...">
      </div>

      <div class="filters-group">
        <div class="filter-select-wrapper">
          <select id="teamFilter">
            <option value="all">All Teams</option>
          </select>
        </div>
        
        <div class="filter-select-wrapper">
          <select id="statusFilter">
            <option value="all">All Statuses</option>
            <option value="active">Active</option>
            <option value="inactive">Inactive</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Leaderboard Content -->
    <main class="glass-panel leaderboard-container">
      <!-- Table Header -->
      <div class="leaderboard-header">
        <div class="col-rank">Rank</div>
        <div class="col-name">Player</div>
        <div class="col-team">Team</div>
        <div class="col-status">Status</div>
        <div class="col-score">Score</div>
        <div class="col-trend">Trend</div>
      </div>

      <!-- Table Body -->
      <div id="leaderboardList" class="leaderboard-list">
        <div class="loading-state">
          <div class="spinner"></div>
          <p>Connecting to Google Sheet...</p>
        </div>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
